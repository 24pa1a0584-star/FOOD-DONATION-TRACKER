# Put this folder's contents at the root of your GitHub repository.
# Free plans are for a temporary demo; free PostgreSQL expires after 30 days.
services:
  - type: web
    name: food-donation-tracker
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --access-logfile - --error-logfile -
    healthCheckPath: /healthz
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: food-donation-db
          property: connectionString
      - key: SHOW_DEMO_ACCOUNTS
        value: "false"
databases:
  - name: food-donation-db
    plan: free
    region: singapore
    databaseName: food_donation
    user: food_donation
    ipAllowList: []
