{% extends "base.html" %}

{% block title %}Page Not Found (404){% endblock %}

{% block content %}
<div class="container text-center py-5">
  <div class="empty-state">
    <div class="text-warning mb-3" style="font-size: 4rem;">
      <i class="bi bi-question-circle"></i>
    </div>
    <h1 class="h3 fw-bold text-dark mb-2">Page Not Found</h1>
    <p class="text-muted" style="max-width: 480px; margin: 0 auto 1.5rem auto;">
      The page or donation you are looking for does not exist or may have been removed.
    </p>
    <a href="{{ url_for('main.home') }}" class="btn btn-primary-food">
      <i class="bi bi-house-door me-1"></i>Back to Home
    </a>
  </div>
</div>
{% endblock %}
