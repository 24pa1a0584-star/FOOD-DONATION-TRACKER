{% extends "base.html" %}

{% block title %}Server Error (500){% endblock %}

{% block content %}
<div class="container text-center py-5">
  <div class="empty-state">
    <div class="text-danger mb-3" style="font-size: 4rem;">
      <i class="bi bi-exclamation-triangle-fill"></i>
    </div>
    <h1 class="h3 fw-bold text-dark mb-2">Something Went Wrong</h1>
    <p class="text-muted" style="max-width: 480px; margin: 0 auto 1.5rem auto;">
      An unexpected internal error occurred. Please try again or return to the home page.
    </p>
    <a href="{{ url_for('main.home') }}" class="btn btn-primary-food">
      <i class="bi bi-house-door me-1"></i>Back to Home
    </a>
  </div>
</div>
{% endblock %}
